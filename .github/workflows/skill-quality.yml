name: Skill quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: skill-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Static skill checks
        run: python tools/skill_quality.py --check-catalog
      - name: Archive tracked source for reproducible review
        run: git archive --format=zip HEAD -o "${RUNNER_TEMP}/skill-source.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skill-source-${{ github.sha }}
          path: ${{ runner.temp }}/skill-source.zip
          retention-days: 3
          if-no-files-found: error
