name: Behavior runtime
on:
  push:
    paths:
      - 'tests/behavior/**'
      - 'tests/test_behavior_*'
      - '.github/workflows/behavior-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Input acquisition unit tests
        run: python -m unittest discover -s tests -p 'test_behavior_inputs.py' -v
      - name: Acquire pinned runtime inputs (not an engine pass)
        run: python tests/behavior/acquire_inputs.py --download --root "${RUNNER_TEMP}/behavior-runtime"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: behavior-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/behavior-runtime/
          if-no-files-found: error
          retention-days: 7
